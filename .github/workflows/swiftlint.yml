name: SwiftLint
permissions:
  contents: read
  pull-requests: write
on:
  workflow_dispatch: {}
  pull_request: {}
jobs:
  SwiftLint:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint --quiet --reporter github-actions-logging
